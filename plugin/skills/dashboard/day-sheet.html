        h("label", { class: "planmain", for: box.id }, h("time", {}, when), h("b", {}, t.title),
          h("span", { class: "sub" }, t.kind === "calls" ? t.ids.map((id) => (S.items.get(id) || {}).who).filter(Boolean).join(", ") : PRIO[t.prio].label)),
        h("div", { class: "planctl" }, len,
          h("button", { id: upId, class: "iconbtn small", type: "button", "aria-label": `Move ${t.title} earlier`, title: "Earlier", disabled: i === 0 || done, onclick: () => move(-1, upId) }, "↑"),
          h("button", { id: downId, class: "iconbtn small", type: "button", "aria-label": `Move ${t.title} later`, title: "Later", disabled: i === rows.length - 1 || done, onclick: () => move(1, downId) }, "↓")));
    }));

    btn.textContent = n ? `Add ${n} block${n === 1 ? "" : "s"} to your calendar` : "Nothing to add";

function draftHtml(text) {

  return '<div dir="auto">' + esc.replace(/\r\n?/g, "\n").replace(/\n/g, "<br>") + "</div>";
}

  const out = [], bad = [];

    if (/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(addr)) out.push(addr); else bad.push(raw);

}

  const form = h("form", { style: "display:grid;gap:12px" },
    h("label", { class: "field", for: "nmTo" }, "To", to),
    h("div", { class: "row" },
      h("label", { class: "field", for: "nmCc", style: "flex:1;min-width:160px" }, "Cc", cc),
      h("label", { class: "field", for: "nmBcc", style: "flex:1;min-width:160px" }, "Bcc", bcc)),
    h("label", { class: "field", for: "nmSubj" }, "Subject", subj),
    h("div", { class: "panel", style: "margin:0;padding:12px;border:1px dashed var(--line);border-radius:10px" },
      h("label", { class: "field", for: "nmAsk" }, "Have Claude write it: what should it say?", ask),
      h("div", { class: "row" }, write)),
    body,
    h("div", { class: "meta", style: "margin:0" }, "Saved as a draft in Gmail. Nothing is sent until you send it from Drafts or Gmail."),
    msg, h("div", { class: "row" }, save, links));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const T = parseAddresses(to.value), C = parseAddresses(cc.value), B = parseAddresses(bcc.value);
    const bad = [...T.bad, ...C.bad, ...B.bad];
    if (bad.length) { note(`These don't look like email addresses: ${bad.join(", ")}`, true); return; }
    if (!body.value.trim() && !subj.value.trim()) { note("Write a subject or a message first.", true); return; }
    save.disabled = true; save.textContent = "Saving…"; note("");
    try {
      const d = await call(GMAIL, "create_draft", {
        ...(T.out.length ? { to: T.out } : {}), ...(C.out.length ? { cc: C.out } : {}), ...(B.out.length ? { bcc: B.out } : {}),
        subject: subj.value.trim(), htmlBody: draftHtml(body.value),
      });
      save.textContent = "Saved ✓ Save again"; save.disabled = false;
      links.replaceChildren(...(d && d.viewUrl ? appLinks("gmail", d.viewUrl) : []));
      note(T.out.length ? "Saved to Gmail Drafts. Send it from Drafts (the envelope at the top) or from Gmail." : "Saved to Gmail Drafts with no recipient yet. Add one in Gmail before sending.");
      toast("Saved to Gmail Drafts. It hasn't been sent.");
    } catch (err) {
      save.disabled = false; save.textContent = "Save to Gmail Drafts";
      note(connectorMessage(GMAIL, err), true);
    }
  });
  sheetShell("New email", "Write it yourself, or tell Claude what to say.", form);
  to.focus();
}

// The Gmail tools have no From field, so Gmail picks the address for a reply
// draft. This reads it back and compares it with the addresses the email was
// sent to, so a reply from the wrong address is caught before it's sent.
async function replyFrom(it, draftId) {
  try {
    const [dr, full] = await Promise.all([
      call(GMAIL, "get_draft", { draftId, messageFormat: "MINIMAL" }, { cache: false }),
      fullThread(it.ref, "MINIMAL")]);
    const from = senderAddr(dField(dr, "sender", "from") || "");
    const msgs = (full && full.messages) || [];
    const m = msgs.find((x) => x.id === it.lastMsgId) || latestOf(msgs) || {};
    const to = [...[].concat(m.toRecipients || m.to_recipients || []), ...[].concat(m.ccRecipients || m.cc_recipients || [])].map(senderAddr).filter(Boolean);
    if (!from) return null;
    if (!to.length || to.includes(from)) return { text: `It will be sent from ${from}.`, warn: false };
    return { text: `It will be sent from ${from}, but the email was sent to ${to.join(", ")}. To reply from that address, open the draft in Gmail and change From before sending.`, warn: true };
  } catch (e) { return null; }
}

// ---------------------------------------------------------------- drafts
// Your Gmail drafts, with Send. Sending always asks first, and sends the
// draft exactly as it's saved in Gmail, attachments and thread included.
const dField = (d, ...names) => { for (const src of [d, d && d.message]) for (const n of names) if (src && src[n] !== undefined && src[n] !== null) return src[n]; return undefined; };
async function openDrafts() {
  const sh = S.sheet = { kind: "drafts" };
  const list = h("ul", { class: "drafts" });
  const status = h("div", { role: "status" }, h("div", { class: "note" }, "Loading your drafts…"));
  const draw = (drafts) => {
    status.replaceChildren(drafts.length ? "" : h("div", { class: "note" }, "No drafts in Gmail."));
    list.replaceChildren(...drafts.map((d) => {
      const id = d.id || dField(d, "draftId");
      const to = [].concat(dField(d, "toRecipients", "to_recipients") || []);
      const cc = [].concat(dField(d, "ccRecipients", "cc_recipients") || []);
      const bcc = [].concat(dField(d, "bccRecipients", "bcc_recipients") || []);
      const subject = decode(dField(d, "subject") || "(no subject)");
      // Drafts saved from here are HTML only, with no plain-text part to show.
      const html = dField(d, "htmlBody", "html_body");
      const body = String(dField(d, "plaintextBody", "plaintext_body")
        || (html ? decode(String(html).replace(/<br\s*\/?>|<\/(div|p)>/gi, "\n").replace(/<[^>]*>/g, "")) : decode(dField(d, "snippet") || ""))).trim();
      const url = dField(d, "viewUrl", "view_url");
      const when = dField(d, "date");
      const everyone = [...to, ...cc, ...bcc];
      const li = h("li", {});
      const actions = h("div", { class: "row" });
      const normal = () => actions.replaceChildren(
        h("button", { class: "btn primary", type: "button", disabled: !everyone.length, title: everyone.length ? "" : "Add a recipient in Gmail first", onclick: askSend }, "Send…"),
        ...(url ? appLinks("gmail", url) : []),
        h("button", { class: "btn danger", type: "button", onclick: askDelete }, "Delete…"));
      // The connector's send has no From field: a draft goes from the address
      // saved on it (change it in Gmail). The confirm step shows that address.
      function askSend() {
        const from = h("b", {}, "checking…");
        call(GMAIL, "get_draft", { draftId: id, messageFormat: "MINIMAL" }, { cache: false })
          .then((full) => { const f = dField(full, "sender", "from"); from.textContent = f ? String(f) : "your Gmail default address"; })
          .catch(() => { from.textContent = "your Gmail default address (couldn't check)"; });
        actions.replaceChildren(h("div", { class: "confirm", role: "alertdialog", "aria-label": "Confirm sending" },
          h("div", {}, "From ", from),
          h("div", {}, "Send this email now to ", h("b", {}, everyone.join(", ")), "? You can't unsend it from here. To send from a different address, open it in Gmail and change From first."),
          h("div", { class: "row" },
            h("button", { class: "btn primary", type: "button", onclick: async (e) => {
              e.currentTarget.disabled = true; e.currentTarget.textContent = "Sending…";
              try { await call(GMAIL, "send_message", { draftId: id }); toast("Sent to " + everyone.join(", ")); li.remove(); if (!list.children.length) draw([]); }
              catch (err) { normal(); status.replaceChildren(h("div", { class: "note bad" }, connectorMessage(GMAIL, err))); }
            } }, "Send now"),
            h("button", { class: "btn", type: "button", onclick: normal }, "Cancel"))));
        actions.querySelector("button").focus();
      }
      function askDelete() {
        actions.replaceChildren(h("div", { class: "confirm", role: "alertdialog", "aria-label": "Confirm deleting" },
          h("div", {}, "Delete this draft from Gmail?"),
          h("div", { class: "row" },
            h("button", { class: "btn danger", type: "button", onclick: async (e) => {
              e.currentTarget.disabled = true;
              try { await call(GMAIL, "delete_draft", { draftId: id }); toast("Draft deleted"); li.remove(); if (!list.children.length) draw([]); }
              catch (err) { normal(); status.replaceChildren(h("div", { class: "note bad" }, connectorMessage(GMAIL, err))); }
            } }, "Delete"),
            h("button", { class: "btn", type: "button", onclick: normal }, "Cancel"))));
      }
      normal();
      li.append(
        h("div", { class: "row", style: "justify-content:space-between" },
          h("span", { class: "to" }, everyone.length ? "To " + to.concat(cc).join(", ") + (bcc.length ? ` (+${bcc.length} Bcc)` : "") : "No recipient yet"),
          when ? h("span", { class: "age" }, age(Date.parse(when) || Number(when))) : null),
        h("div", {}, subject),
        body ? h("div", { class: "snip" }, body) : null,
        actions);
      return li;
    }));
  };
  sheetShell("Drafts", "Your Gmail drafts, newest first. Send asks you to confirm; to edit one, open it in Gmail.",
    h("div", { style: "display:grid;gap:12px" },
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => { closeSheet(); openNewEmail(); } }, "+ New email")),
      status, list));
  try {
    const p = await call(GMAIL, "list_drafts", { pageSize: 50, view: "DRAFT_VIEW_FULL" }, { cache: false });
    if (S.sheet !== sh) return;
    draw((p && p.drafts) || []);
  } catch (e) {
    if (S.sheet === sh) status.replaceChildren(h("div", { class: "note bad" }, connectorMessage(GMAIL, e)));
  }
}

// -------------------------------------------------------------- keyboard
const SHORTCUTS = [
  [["j"], "Next email"], [["k"], "Previous email"], [["o", "Enter"], "Open its actions"],
  [["e"], "Done"], [["r"], "Draft a reply"], [["b"], "Book time (Work emails)"], [["h"], "Hide it until tomorrow"],
  [["#"], "Delete (moves it to Gmail's Trash)"], [["←", "→"], "Previous or next day"], [["t"], "Back to today"],
  [["p"], "Plan the day you're looking at"], [["n"], "New event"], [["c"], "New email (saved as a draft)"], [["d"], "Drafts"], [[","], "Settings"], [["?"], "These shortcuts"], [["Esc"], "Close"],
];
function openHelp() {
  S.sheet = { kind: "help" };
  sheetShell("Keyboard shortcuts", "For a computer keyboard. You can turn them off in Settings.",
    h("dl", { class: "keys" }, SHORTCUTS.flatMap(([keys, what]) => [h("dt", {}, keys.map((k) => h("kbd", {}, k))), h("dd", {}, what)])));
}
function cursorRows() { return [...document.querySelectorAll("#list li.item[data-id]")]; }
function applyCursor(scroll) {
  for (const r of document.querySelectorAll("#list li.item.cursor")) r.classList.remove("cursor");
  const row = S.cursor && cursorRows().find((r) => r.dataset.id === S.cursor);
  if (!row) return;
  row.classList.add("cursor");
  if (scroll) row.scrollIntoView({ block: "nearest" });
}
function moveCursor(n) {
  const rows = cursorRows(); if (!rows.length) return;
  let i = rows.findIndex((r) => r.dataset.id === S.cursor);
  i = i < 0 ? (n > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, i + n));
  const fold = rows[i].closest("details");
  if (fold && !fold.open) fold.open = true;
  S.cursor = rows[i].dataset.id; applyCursor(true);
}
// The card the cursor moves to when the current one leaves the list.
function neighbour() {
  const rows = cursorRows(), i = rows.findIndex((r) => r.dataset.id === S.cursor);
  const next = i < 0 ? null : rows[i + 1] || rows[i - 1];
  return next ? next.dataset.id : null;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.sheet) closeSheet(); return; }
  if (!pref("shortcuts") || S.sheet || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target;
  if (t && t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "Enter" && t && t.closest && t.closest("button,a,summary")) return;
  const k = e.key, today = localDay();
  const cur = S.cursor && S.items.get(S.cursor);
  const live = cur && isOpen(cur) ? cur : null;
  const leave = (fn) => { const next = neighbour(); fn(); S.cursor = next; applyCursor(true); };
  let used = true;
  if (k === "j" || k === "k") moveCursor(k === "j" ? 1 : -1);
  else if (k === "ArrowLeft" || k === "ArrowRight") setDay(addDays(S.day, k === "ArrowRight" ? 1 : -1));
  else if (k === "t") setDay(today);
  else if (k === "p" && S.day >= today) openPlan(S.day);
  else if (k === "n") openNewEvent(S.day);
  else if (k === "c") openNewEmail();
  else if (k === "d") openDrafts();
  else if (k === ",") openSettings();
  else if (k === "?") openHelp();
  else if (live && (k === "o" || k === "Enter")) openSheet({ kind: "item", id: live.id });
  else if (live && k === "e") leave(() => clearItem(live, { status: "done" }, "Done"));
  else if (live && k === "h") leave(() => { const before = { snoozeUntil: live.snoozeUntil || null }; saveItem(live.id, { snoozeUntil: addDays(today, 1) }); toast("See it again tomorrow", () => saveItem(live.id, before)); });
  else if (live && k === "#" && live.source === "email") leave(() => quickGmail(live, "delete"));
  else if (live && k === "r" && live.source === "email") { openSheet({ kind: "item", id: live.id, focus: true }); S.sheet.panel = "draft"; renderSheet(); startDraft(live, false); }
  else if (live && k === "b" && (live.tags || []).includes("work") && !live.blockEventId) { openSheet({ kind: "item", id: live.id, focus: true }); S.sheet.panel = "book"; renderSheet(); }
  else used = false;
  if (used) e.preventDefault();
});

// -------------------------------------------------------------------- boot
$("refreshBtn").addEventListener("click", () => refreshAll());
$("settingsBtn").addEventListener("click", () => openSettings());
$("prevDay").addEventListener("click", () => setDay(addDays(S.day, -1)));
$("nextDay").addEventListener("click", () => setDay(addDays(S.day, 1)));
$("todayBtn").addEventListener("click", () => setDay(localDay()));
$("planBtn").addEventListener("click", () => openPlan(S.day));
$("newEvBtn").addEventListener("click", () => openNewEvent(S.day));
$("newMailBtn").addEventListener("click", () => openNewEmail());
$("draftsBtn").addEventListener("click", () => openDrafts());
render();

(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { setStatus("Open this page in Claude to connect your Gmail and Calendar.", true); return; }
  const [user, db, mcp, sample] = await Promise.all(["user", "db", "mcp", "sample"].map((n) => cl.use(n).catch(() => null)));
  S.mcp = mcp; S.sample = sample;
  S.uid = user ? await user.id() : null;
  try { S.me = user && user.me ? await user.me() : null; } catch (e) { S.me = null; }
  if (db && S.uid) {
    S.db = db;
    S.profileRef = db.doc(`data/users/${S.uid}/profile`);
    S.itemsRef = S.profileRef.collection("items");
    try { const p = await S.profileRef.get(); if (p.exists) S.profile = { ...p.data() }; } catch (e) { /* first visit */ }
    if (S.profile.textSize) applyTextSize(S.profile.textSize);
    applyTheme();
    await new Promise((resolve) => {
      let first = true;
      S.itemsRef.onSnapshot((snap) => {
        for (const ch of snap.docChanges()) {
          if (ch.type === "removed") S.items.delete(ch.doc.id);
          else if (!writing.has(ch.doc.id) || !snap.metadata.hasPendingWrites) S.items.set(ch.doc.id, { ...ch.doc.data(), id: ch.doc.id });
        }
        render();
        if (first) { first = false; resolve(); }
      }, () => { setStatus("Your saved changes can't load right now. Actions will work but won't be kept.", true); resolve(); });
    });
  } else {
    setStatus("Changes you make here won't be saved on this device.", true);
  }
  wakeFollowUps();
  if (!mcp) { setStatus("This page can't reach your connectors here. Open it in Claude, signed in.", true); return; }
  try {
    const lt = await mcp.listTools();
    S.fileArgs = !!lt.fileArgs;
    // Drive is optional: without it, attachments point to Gmail's own Add to Drive.
    S.driveAvailable = (lt.servers || []).some((sv) => sv.server === DRIVE);
  } catch (e) { S.fileArgs = false; S.driveAvailable = false; }
  render();
  // Always refresh on the first visit; after that, as often as the viewer chose.
  const every = Number(pref("autoRefreshHours"));
  const stale = !S.profile.lastRefreshAt || (every > 0 && Date.now() - S.profile.lastRefreshAt > every * 3600000);
  if (stale) refreshAll();
  else { setStatus(""); loadCalendar(false); }
})();
})();
</script>
